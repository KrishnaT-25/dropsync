name: CI

on:
  push:
  pull_request:

jobs:
  client-and-server:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://127.0.0.1:6379
      MONGODB_URI: mongodb://127.0.0.1:27017/dropsync-ci
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Lint client (oxlint)
        run: npm run lint --prefix client

      - name: Typecheck client
        run: npx tsc -b --pretty false
        working-directory: client

      - name: Typecheck server
        run: npx tsc --noEmit --pretty false
        working-directory: server

      - name: Build client
        run: npm run build --prefix client

      - name: Build server
        run: npm run build --prefix server

      - name: Wait for Redis
        working-directory: server
        run: |
          node --input-type=module -e "
          import { Redis } from 'ioredis';
          const r = new Redis(process.env.REDIS_URL);
          const tryPing = async (n) => {
            for (let i = 0; i < n; i++) {
              try {
                await r.ping();
                console.log('Redis is ready');
                await r.quit();
                return;
              } catch {
                await new Promise((res) => setTimeout(res, 1000));
              }
            }
            console.error('Redis did not become ready');
            process.exit(1);
          };
          await tryPing(30);
          "

      - name: Test server
        continue-on-error: true
        run: |
          set -o pipefail
          npm test --prefix server 2>&1 | tee server-test-output.txt
        env:
          REDIS_URL: redis://127.0.0.1:6379
          MONGODB_URI: mongodb://127.0.0.1:27017/dropsync-ci
          CLIENT_ORIGIN: http://localhost:5173
          ROOM_DURATION_SECONDS: '300'

      - name: Upload server test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-output
          path: server-test-output.txt
          if-no-files-found: ignore
