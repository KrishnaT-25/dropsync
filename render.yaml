services:
  - type: web
    name: dropsync-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: REDIS_URL
        fromService:
          name: dropsync-redis
          type: keyvalue
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CLEANUP_SECRET
        sync: false

  - type: keyvalue
    name: dropsync-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
